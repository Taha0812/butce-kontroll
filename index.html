<!DOCTYPE html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Bütçe Kontroll — Kişisel Finans &amp; Gelir-Gider Takibi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>₺</text></svg>" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <div class="logo">₺</div>
          <div class="brand-text">
            <h1>Bütçe Kontroll</h1>
            <p id="headerPeriod">Dönem hesaplanıyor…</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btnAccount" title="Hesap" aria-label="Hesap">👤</button>
          <button class="icon-btn" id="btnRates" title="Kurları yenile" aria-label="Kurları yenile">🔄</button>
          <button class="icon-btn" id="btnTheme" title="Tema değiştir" aria-label="Tema değiştir">🌙</button>
          <button class="icon-btn" id="btnSettings" title="Ayarlar" aria-label="Ayarlar">⚙️</button>
        </div>
      </header>

      <main class="main" id="main">
        <section class="view active" id="view-home" data-view="home"></section>
        <section class="view" id="view-report" data-view="report"></section>
        <section class="view" id="view-assets" data-view="assets"></section>
        <section class="view" id="view-cards" data-view="cards"></section>
        <section class="view" id="view-settings" data-view="settings"></section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-btn active" data-nav="home"><span class="nav-ico">🏠</span><span class="nav-lbl">Ana</span></button>
        <button class="nav-btn" data-nav="report"><span class="nav-ico">📊</span><span class="nav-lbl">Rapor</span></button>
        <button class="nav-add" id="btnAdd" aria-label="İşlem ekle"><span>＋</span></button>
        <button class="nav-btn" data-nav="assets"><span class="nav-ico">💰</span><span class="nav-lbl">Varlık</span></button>
        <button class="nav-btn" data-nav="cards"><span class="nav-ico">💳</span><span class="nav-lbl">Kart</span></button>
      </nav>
    </div>

    <div class="backdrop" id="backdrop"></div>

    <!-- Kayıt / Giriş ekranı (giriş yapılmadan uygulama açılmaz) -->
    <div class="auth-screen" id="authScreen">
      <div class="auth-card">
        <div class="auth-logo">₺</div>
        <h1>Bütçe Kontroll</h1>
        <p class="auth-sub">Hesabına giriş yap — kayıtların sana özel kalır.</p>

        <div class="seg" id="authTabs">
          <button data-auth-tab="login" class="active">Giriş yap</button>
          <button data-auth-tab="register">Kayıt ol</button>
          <button data-auth-tab="reset">Şifre sıfırla</button>
        </div>

        <div class="auth-error" id="authError" hidden></div>

        <div class="field">
          <label id="lblUser">Kullanıcı adı veya e-posta</label>
          <input class="input" id="authUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="örn. ahmet" />
        </div>

        <div class="field" id="fieldEmail" hidden>
          <label>E-posta (opsiyonel · girişte de kullanılabilir)</label>
          <input class="input" id="regEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="ornek@mail.com" />
        </div>

        <div class="field" id="fieldPass">
          <label id="lblPass">Şifre</label>
          <input class="input" id="authPass" type="password" autocomplete="current-password" placeholder="en az 6 karakter" />
        </div>

        <div id="regExtra" hidden>
          <div class="field">
            <label>Güvenlik sorusu (şifreni sıfırlarken sorulur)</label>
            <select class="input" id="regQuestion">
              <option value="İlk evcil hayvanının adı neydi?">İlk evcil hayvanının adı neydi?</option>
              <option value="Doğduğun şehir neresi?">Doğduğun şehir neresi?</option>
              <option value="İlk okulunun adı neydi?">İlk okulunun adı neydi?</option>
              <option value="En sevdiğin yemek hangisi?">En sevdiğin yemek hangisi?</option>
              <option value="Baba adının ilk hecesi?">Baba adının ilk hecesi?</option>
              <option value="__custom">Kendi sorumu yazacağım…</option>
            </select>
            <input class="input" id="regQuestionCustom" placeholder="Kendi güvenlik sorunu yaz" hidden style="margin-top:8px" />
          </div>
          <div class="field">
            <label>Cevap</label>
            <input class="input" id="regAnswer" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="örn. pati" />
          </div>
        </div>

        <div id="resetExtra" hidden>
          <div id="resetStep1">
            <button class="btn block" id="resetAsk">🔐 Güvenlik sorusunu göster</button>
            <p class="small muted" style="margin-top:10px;text-align:center">Kullanıcı adını (veya e-postanı) yukarı yaz, soruyu görelim.</p>
          </div>
          <div id="resetStep2" hidden>
            <div class="question-box" id="resetQuestionText">…</div>
            <div class="field">
              <label>Güvenlik sorusu cevabı</label>
              <input class="input" id="resetAnswer" autocapitalize="none" autocorrect="off" spellcheck="false" />
            </div>
            <div class="field">
              <label>Yeni şifre</label>
              <input class="input" id="resetPass" type="password" autocomplete="new-password" placeholder="en az 6 karakter" />
            </div>
            <button class="btn primary block" id="resetDo">🔒 Şifreyi yenile</button>
          </div>
        </div>

        <button class="btn primary block" id="authSubmit">Giriş yap</button>
        <button class="btn ghost block" id="authGuest">Misafir olarak devam et →</button>

        <div class="auth-mode" id="authMode"><span class="pill">⏳ Bağlanıyor…</span></div>
        <p class="auth-hint" id="authHint"></p>
      </div>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Başlık</h2>
        <button class="icon-btn" id="sheetClose" aria-label="Kapat">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/store.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/views.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
