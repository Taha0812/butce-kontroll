<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bütçe Kontroll">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" />
      <stop offset="1" stop-color="#7a5cff" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- zemin (maskable için tam kare, güvenli alan %80) -->
  <rect width="512" height="512" fill="url(#bg)" />
  <rect width="512" height="512" fill="url(#shine)" />

  <!-- ₺ işareti: üst bar + gövde + iki çapraz bar (metin değil, yolu — tüm sistemlerde çizilir) -->
  <g fill="#ffffff">
    <rect x="132" y="136" width="248" height="56" rx="28" />
    <rect x="228" y="136" width="56" height="240" rx="28" />
    <rect x="172" y="216" width="168" height="46" rx="23" />
    <rect x="172" y="300" width="168" height="46" rx="23" />
  </g>

  <!-- alt vurgu -->
  <circle cx="384" cy="384" r="34" fill="#2ecc8f" />
  <path d="M368 384l12 12 22-26" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
